<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ten Days to Thirty</title>
</head>

<body>
  <script>
    // GitHub Pages / browsers cache index.html itself, so a fresh deploy of
    // app.html can still show a stale version. This loader always fetches
    // app.html with a cache-busting query string, then writes it into the
    // document so its own scripts execute normally.
    var v = Date.now();
    fetch('app.html?v=' + v, { cache: 'no-store' })
      .then(function (res) { return res.text(); })
      .then(function (html) {
        // also cache-bust content.js so edits to it show up immediately
        html = html.replace('src="content.js"', 'src="content.js?v=' + v + '"');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.body.textContent = 'Could not load the page. Please refresh.';
      });
  </script>
</body>

</html>
