<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ten Days to Thirty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --night-1: #12162a;
      --night-2: #1c2246;
      --gold: #d9a857;
      --gold-bright: #f0c887;
      --rust: #b85c38;
      --cream: #f3ecdd;
      --cream-dim: #cfc6ae;
      --teal: #3a6b63;
      --locked: #4b4a68;
      --locked-line: rgba(75, 74, 104, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night-1) 70%);
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Amiri', serif;
    }

    /* ---------- stars ---------- */
    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    #stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--cream);
      opacity: 0.35;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .15;
      }

      50% {
        opacity: .6;
      }
    }

    /* ---------- gate ---------- */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night-1) 70%);
    }

    #gate .box {
      text-align: center;
      max-width: 360px;
      width: 100%;
    }

    #gate .eyebrow {
      letter-spacing: .2em;
      text-transform: uppercase;
      font-size: .7rem;
      color: var(--gold);
      margin-bottom: 14px;
    }

    #gate h1 {
      font-size: 2.1rem;
      font-weight: 400;
      margin: 0 0 8px;
      color: var(--cream);
    }

    #gate p {
      color: var(--cream-dim);
      font-size: .95rem;
      margin: 0 0 28px;
      line-height: 1.6;
    }

    #gate input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(217, 168, 87, 0.35);
      border-radius: 8px;
      color: var(--cream);
      font-family: 'Jost', sans-serif;
      letter-spacing: .05em;
      outline: none;
    }

    #gate input:focus {
      border-color: var(--gold);
    }

    #gate button {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: var(--gold);
      color: var(--night-1);
      font-family: 'Jost', sans-serif;
      font-size: .95rem;
      font-weight: 500;
      letter-spacing: .03em;
      cursor: pointer;
      transition: background .2s ease;
    }

    #gate button:hover {
      background: var(--gold-bright);
    }

    #gate .err {
      margin-top: 12px;
      font-size: .82rem;
      color: var(--rust);
      min-height: 1.2em;
    }

    /* ---------- app shell ---------- */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #app[hidden] {
      display: none;
    }

    header.top {
      text-align: center;
      padding: 36px 20px 8px;
    }

    header.top .eyebrow {
      letter-spacing: .25em;
      text-transform: uppercase;
      font-size: .68rem;
      color: var(--gold);
    }

    header.top h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin: 8px 0 6px;
      font-weight: 400;
    }

    header.top p {
      color: var(--cream-dim);
      font-size: .9rem;
      margin: 0;
    }

    #map-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 10px 0;
      min-height: 0;
    }

    #map-svg {
      width: 100%;
      max-width: 1100px;
      height: auto;
    }

    .land {
      fill: rgba(255, 255, 255, 0.05);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: .5;
    }

    .thread {
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.1;
      opacity: .55;
      stroke-dasharray: 6 4;
    }

    .pin-group {
      cursor: default;
    }

    .pin-group.unlocked {
      cursor: pointer;
    }

    .pin-hit {
      fill: transparent;
      pointer-events: all;
    }

    .pin-group.locked .pin-hit {
      cursor: default;
      pointer-events: none;
    }

    .pin-group.unlocked .pin-hit {
      cursor: pointer;
    }

    .pin-halo {
      fill: var(--gold);
      opacity: 0;
      transform-origin: center;
      pointer-events: none;
    }

    .pin-group.today .pin-halo {
      opacity: .35;
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: .35;
      }

      70% {
        transform: scale(2.6);
        opacity: 0;
      }

      100% {
        transform: scale(2.6);
        opacity: 0;
      }
    }

    .pin-dot {
      transition: fill .3s ease, r .2s ease;
    }

    .pin-group.locked .pin-dot {
      fill: var(--locked);
      r: 3.2;
    }

    .pin-group.unlocked .pin-dot {
      fill: var(--gold);
      r: 4.4;
    }

    .pin-group.today .pin-dot {
      fill: var(--gold-bright);
      r: 5.2;
    }

    .pin-group.final.unlocked .pin-dot,
    .pin-group.final.today .pin-dot {
      fill: var(--rust);
      r: 6;
    }

    .pin-group:hover .pin-dot {
      r: 7;
    }

    .pin-label {
      font-family: 'Jost', sans-serif;
      font-size: 9px;
      letter-spacing: .02em;
      fill: var(--cream-dim);
      pointer-events: none;
    }

    .pin-group.locked .pin-label {
      fill: var(--locked);
      opacity: .7;
    }

    .pin-group.unlocked .pin-label,
    .pin-group.today .pin-label,
    .pin-group.final .pin-label {
      fill: var(--cream);
    }

    footer.bottom {
      text-align: center;
      padding: 18px 20px 34px;
      color: var(--cream-dim);
      font-size: .82rem;
      letter-spacing: .03em;
    }

    footer.bottom .count {
      color: var(--gold);
    }

    /* ---------- modal ---------- */
    #modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(10, 12, 24, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    #modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    #modal {
      background: linear-gradient(180deg, #232951, #1a2044);
      border: 1px solid rgba(217, 168, 87, 0.25);
      border-radius: 14px;
      max-width: 560px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 34px 30px;
      position: relative;
      transform: translateY(12px);
      transition: transform .25s ease;
    }

    #modal-backdrop.show #modal {
      transform: translateY(0);
    }

    #modal .close {
      position: absolute;
      top: 16px;
      right: 18px;
      background: none;
      border: none;
      color: var(--cream-dim);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    #modal .close:hover {
      color: var(--cream);
    }

    #modal .tag {
      font-size: .72rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    #modal h2 {
      font-size: 1.5rem;
      font-weight: 400;
      margin: 0 0 4px;
    }

    #modal .place {
      font-size: .82rem;
      color: var(--cream-dim);
      margin-bottom: 22px;
    }

    #modal .letter {
      font-size: 1rem;
      line-height: 1.75;
      color: var(--cream);
      white-space: pre-wrap;
    }

    #modal img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    #modal .caption {
      font-size: .82rem;
      color: var(--cream-dim);
      font-style: italic;
    }

    #modal iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    #modal .gift-intro {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 22px;
      color: var(--cream);
    }

    #modal .gift-list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: gift;
    }

    #modal .gift-list li {
      counter-increment: gift;
      padding: 14px 0 14px 40px;
      position: relative;
      border-top: 1px solid rgba(217, 168, 87, 0.18);
    }

    #modal .gift-list li:before {
      content: counter(gift);
      position: absolute;
      left: 0;
      top: 14px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: .78rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #modal .gift-list .gift-name {
      font-weight: 500;
      color: var(--gold-bright);
      display: block;
      margin-bottom: 2px;
    }

    #modal .gift-list .gift-reason {
      font-size: .92rem;
      color: var(--cream-dim);
      line-height: 1.55;
    }

    @media (max-width:520px) {
      #modal {
        padding: 26px 20px;
      }

      header.top {
        padding-top: 26px;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    @media (prefers-reduced-motion: reduce) {
      .pin-group.today .pin-halo {
        animation: none;
        opacity: .2;
      }

      #stars span {
        animation: none;
        opacity: .3;
      }
    }
  </style>
</head>

<body>

  <div id="stars"></div>

  <!-- PASSCODE GATE -->
  <div id="gate">
    <div class="box">
      <div class="eyebrow">For Ellen</div>
      <h1>Ten days to thirty</h1>
      <p>Someone has to knock before the door opens.</p>
      <input type="text" id="passcode-input" placeholder="passcode" autocomplete="off" />
      <button id="passcode-btn">Open</button>
      <div class="err" id="passcode-err"></div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" hidden>
    <header class="top">
      <div class="eyebrow" id="header-eyebrow">A gift, sent from everywhere</div>
      <h1>Ten days to thirty</h1>
      <p id="header-sub">Every light on this map is someone who loves you.</p>
    </header>

    <div id="map-wrap">
      <svg id="map-svg" viewBox="0 0 960 500" role="img"
        aria-label="World map showing locations of people who sent birthday messages"></svg>
    </div>

    <footer class="bottom">
      <span class="count" id="lit-count">0</span> of 10 lights lit
    </footer>
  </div>

  <!-- MODAL -->
  <div id="modal-backdrop">
    <div id="modal" role="dialog" aria-modal="true">
      <button class="close" id="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // GitHub Pages serves this page with Cache-Control: max-age=600, so the
    // browser can reuse a stale copy for up to 10 minutes without checking
    // the network at all. A service worker takes over after the first visit
    // and forces every future load to go to the network. See sw.js.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script src="content.js"></script>
  <script>
    (function () {
    /* ============================================================
       Passcode gate
       ============================================================ */
    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const pwInput = document.getElementById('passcode-input');
    const pwBtn = document.getElementById('passcode-btn');
    const pwErr = document.getElementById('passcode-err');

    function tryUnlock() {
      const val = pwInput.value.trim().toLowerCase();
      if (val === COUNTDOWN.passcode.toLowerCase()) {
        localStorage.setItem('ellen30_unlocked', 'true');
        gate.style.display = 'none';
        app.hidden = false;
        initApp();
      } else {
        pwErr.textContent = "That's not it, try again.";
      }
    }
    pwBtn.addEventListener('click', tryUnlock);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });

    /* ============================================================
       Date / unlock logic
       ============================================================ */
    function daysBetween(a, b) {
      return Math.floor((b - a) / (1000 * 60 * 60 * 24));
    }
    function currentUnlockedDay() {
      const start = new Date(COUNTDOWN.startDate + 'T00:00:00');
      const today = new Date();
      const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const diff = daysBetween(start, t0); // 0 on startDate
      if (diff < 0) return 0;
      return Math.min(diff + 1, 10);
    }

    /* ============================================================
       Stars background
       ============================================================ */
    (function makeStars() {
      const container = document.getElementById('stars');
      const n = 70;
      for (let i = 0; i < n; i++) {
        const s = document.createElement('span');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDelay = (Math.random() * 4) + 's';
        container.appendChild(s);
      }
    })();

    /* ============================================================
       Map + pins
       ============================================================ */
    let appInitialized = false;

    function initApp() {
      if (appInitialized) return;
      appInitialized = true;

      const svg = d3.select('#map-svg');
      const width = 960, height = 500;
      const projection = d3.geoNaturalEarth1().scale(175).translate([width / 2, height / 2 + 20]);
      const path = d3.geoPath(projection);

      const unlockedDay = currentUnlockedDay();
      document.getElementById('lit-count').textContent = unlockedDay;

      const finalPerson = PEOPLE.find(p => p.day === 10);
      const finalXY = projection([finalPerson.lon, finalPerson.lat]);

      d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
        const land = topojson.feature(world, world.objects.countries);

        svg.append('g')
          .selectAll('path')
          .data(land.features)
          .join('path')
          .attr('class', 'land')
          .attr('d', path);

        drawThreads();
        drawPins();
      }).catch(() => {
        // if offline, still draw pins without the landmass outline
        drawThreads();
        drawPins();
      });

      function drawThreads() {
        const threadsGroup = svg.append('g').attr('class', 'threads');
        PEOPLE.filter(p => p.day < 10 && p.day <= unlockedDay).forEach(p => {
          const [x1, y1] = projection([p.lon, p.lat]);
          const mx = (x1 + finalXY[0]) / 2;
          const my = Math.min(y1, finalXY[1]) - 40;
          const d = `M${x1},${y1} Q${mx},${my} ${finalXY[0]},${finalXY[1]}`;
          threadsGroup.append('path')
            .attr('class', 'thread')
            .attr('d', d)
            .attr('stroke-dasharray', function () { return this.getTotalLength(); })
            .attr('stroke-dashoffset', function () { return this.getTotalLength(); })
            .transition().duration(1200).delay(300)
            .attr('stroke-dashoffset', 0)
            .on('end', function () { d3.select(this).attr('stroke-dasharray', '6 4'); });
        });
      }

      function drawPins() {
        const pinsGroup = svg.append('g').attr('class', 'pins');

        // draw unlocked pins last (on top) so an overlapping locked pin can
        // never sit above and block clicks on a clickable one
        const drawOrder = [...PEOPLE].sort((a, b) => (a.day <= unlockedDay) - (b.day <= unlockedDay));

        const nodes = pinsGroup.selectAll('g.pin-group')
          .data(drawOrder)
          .join('g')
          .attr('class', p => {
            let cls = 'pin-group ';
            if (p.day === 10) cls += 'final ';
            if (p.day === unlockedDay) cls += 'today unlocked';
            else if (p.day < unlockedDay) cls += 'unlocked';
            else cls += 'locked';
            return cls;
          })
          .attr('transform', p => {
            const [x, y] = projection([p.lon, p.lat]);
            return `translate(${x},${y})`;
          });

        nodes.append('circle').attr('class', 'pin-hit').attr('r', 14);
        nodes.append('circle').attr('class', 'pin-halo').attr('r', 5);
        nodes.append('circle').attr('class', 'pin-dot').attr('r', 3.2);

        nodes.append('text')
          .attr('class', 'pin-label')
          .attr('x', 9).attr('y', 3)
          .text(p => p.day <= unlockedDay ? `${p.day}. ${p.name}` : `Day ${p.day}`);

        nodes.filter(p => p.day <= unlockedDay)
          .on('click', (event, p) => openModal(p));

        nodes.filter(p => p.day <= unlockedDay)
          .append('title')
          .text(p => `${p.name} — ${p.city}, ${p.country}`);
      }
    }

    /* ============================================================
       Modal content rendering
       ============================================================ */
    const backdrop = document.getElementById('modal-backdrop');
    const modalBody = document.getElementById('modal-body');
    document.getElementById('modal-close').addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function closeModal() {
      backdrop.classList.remove('show');
    }

    function openModal(p) {
      let html = `<div class="tag">Day ${p.day} &middot; ${p.relation}</div>
              <h2>${p.name}</h2>
              <div class="place">${p.city}, ${p.country}</div>`;

      if (p.type === 'letter') {
        html += `<div class="letter">${escapeHtml(p.content)}</div>`;
      } else if (p.type === 'photo') {
        html += `<img src="${p.content.src}" alt="${escapeHtml(p.content.caption || '')}" />
              <div class="caption">${escapeHtml(p.content.caption || '')}</div>`;
      } else if (p.type === 'video') {
        html += `<iframe src="${p.content.embedUrl}" allowfullscreen></iframe>
              <div class="caption">${escapeHtml(p.content.caption || '')}</div>`;
      } else if (p.type === 'giftlist') {
        html += `<div class="gift-intro">${escapeHtml(p.intro || '')}</div>
             <ul class="gift-list">` +
          p.content.map(g => `<li><span class="gift-name">${escapeHtml(g.gift)}</span><span class="gift-reason">${escapeHtml(g.reason)}</span></li>`).join('') +
          `</ul>`;
      }

      modalBody.innerHTML = html;
      backdrop.classList.add('show');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    if (localStorage.getItem('ellen30_unlocked') === 'true') {
      gate.style.display = 'none';
      app.hidden = false;
      initApp();
    }
    })();
  </script>
</body>

</html>
